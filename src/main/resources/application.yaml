  spring:
    application:
      name: food-ordering-backend

    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: 8081

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000